name: Validate endpoint toolkit

"on":
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Native contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Set up build-only Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install declared build tooling
        run: npm ci --ignore-scripts --no-fund
      - name: Resolve pinned Rust toolchain and components
        run: rustup show active-toolchain
      - name: Check Rust formatting and Clippy
        run: npm run check:rust
      - name: Test Rust configuration and read-only CLI contracts
        run: npm run test:rust
      - name: Build standalone read-only Rust CLI
        run: npm run build:rust
      - name: Install pinned ShellCheck on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Archive = Join-Path $env:RUNNER_TEMP 'shellcheck-v0.10.0.zip'
          $Destination = Join-Path $env:RUNNER_TEMP 'shellcheck-v0.10.0'
          Invoke-WebRequest -UseBasicParsing -TimeoutSec 60 -Uri 'https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.zip' -OutFile $Archive
          if ((Get-FileHash -LiteralPath $Archive -Algorithm SHA256).Hash -ne 'EB6CD53A54EA97A56540E9D296CE7E2FA68715AA507FF23574646C1E12B2E143') {
            throw 'ShellCheck archive checksum mismatch.'
          }
          Expand-Archive -LiteralPath $Archive -DestinationPath $Destination
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $Destination -Encoding UTF8
          & (Join-Path $Destination 'shellcheck.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'ShellCheck failed to start.' }
      - name: Install ShellCheck on macOS
        if: runner.os == 'macOS'
        run: brew list shellcheck >/dev/null 2>&1 || brew install shellcheck
      - name: Test schemas and standalone artifact generation
        run: npm test
      - name: Check source, links, shell syntax, and shell lint
        run: npm run check
      - name: Lint workflow YAML
        if: runner.os == 'Linux'
        run: pipx run --spec yamllint==1.38.0 yamllint -c .yamllint.yml .github/workflows/validate.yml .yamllint.yml
      - name: Windows configuration and storage mocks
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & .\services\devbox\windows\tests\configuration.ps1
          & .\services\devbox\windows\tests\resize-devbox.ps1
          & .\services\devbox\windows\tests\scheduled-task.ps1
      - name: Linux and macOS hash and dispatch contracts
        if: runner.os != 'Windows'
        run: bash services/devbox/macos/tests/contracts.sh
      - name: macOS configuration and scheduler serialization
        if: runner.os == 'macOS'
        run: bash services/devbox/macos/tests/configuration.sh
      - name: Build and inspect unsigned macOS validation package
        if: runner.os == 'macOS'
        run: |
          bash tools/package-macos.sh --unsigned
          pkgutil --payload-files output/devbox/macos/bos-devbox-*.pkg
