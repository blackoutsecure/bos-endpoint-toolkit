[workspace]
members = ["framework/crates/endpoint-core", "framework/crates/endpoint-cli"]
default-members = ["framework/crates/endpoint-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/blackoutsecure/bos-endpoint-toolkit"
publish = false

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
jsonschema = { version = "0.60.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tempfile = "3.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
strip = "debuginfo"
